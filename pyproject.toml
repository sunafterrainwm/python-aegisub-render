[project]
name = "aegisub-render"
version = "0.1.0"
description = "Run Aegisub 3.5.1 Automation 4 scripts (kara-templater and friends) headlessly from Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "regex>=2024.11.6",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# PyAV is only needed to probe a real video file (video/probe.py imports it lazily), so a
# project that only borrows the headless macros (measure/offset) does not have to install it.
# This repository's own uv sync keeps it: see default-extras below.
video = ["av>=14"]

[project.scripts]
aegisub-render = "aegisub_render.cli:main"

# Installable, but meant to be installed only as a link to this repository:
#     uv add --editable <path to this repo>
# which puts a .pth file pointing at the repository into the consumer's environment (uv's own
# editable install; on Windows no junction is needed for that, the .pth is the link). Do not ship
# a wheel: the extension modules (src/aegisub_render/**/_*.pyd, **/*.so) are built by
# native/build.py for one interpreter and committed to the repository instead of being built on
# install, so a wheel built from here claims py3-none-any while carrying this machine's binaries.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # this repository's own environment keeps PyAV (the tests probe real videos); the version
    # lives in the [project.optional-dependencies] video extra, not here
    "aegisub-render[video]",
    "basedpyright>=1.29",
    "cython>=3.3.0",
    "distlib>=0.3.9",
    "meson>=1.12.1",
    "ninja>=1.13.2",
    "pytest>=8.3",
    "ruff>=0.11",
]
build = [
    "cython>=3.1",
    "meson>=1.6",
    "ninja>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# src layout: the package is src/aegisub_render (module-root = "src" is also uv_build's default)
module-root = "src"
module-name = "aegisub_render"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["reference", "native/subprojects"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "ANN", "TID"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW2901",
    "SIM108", "SIM105", "SIM113", "RUF001", "RUF002", "RUF003",
    "UP031",    # %-formatting is used on purpose where it reproduces C printf output
    "PLC0415",  # PyAV is imported lazily: it is only needed when a real video is probed
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Banned: this project relies on Python 3.14 deferred annotations (PEP 649/749)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "PT018", "E501"]
"scripts/gen_cases.py" = ["E501"]  # template lines are data

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src/aegisub_render", "tests", "scripts", "config.py", "native/build.py", "native/stubgen.py", "native/sync_upstream.py", "aegisub-render.py"]
exclude = ["reference", "native/subprojects", "**/__pycache__"]
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# LuaJIT raises every Lua error (even ones caught by pcall) as a Windows SEH exception with code
# 0xE24C4A0x; pytest's faulthandler plugin would print a "fatal exception" report for each one.
addopts = "-ra -p no:faulthandler"
