[project]
name = "aegisub-render"
version = "0.1.0"
description = "Run Aegisub 3.5.0 Automation 4 scripts (kara-templater and friends) headlessly from Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=14",
    "regex>=2024.11.6",
]

[project.scripts]
aegisub-render = "aegisub_render.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8.3",
    "ruff>=0.11",
]
build = [
    "meson>=1.6",
    "ninja>=1.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisub_render"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["reference", "native/subprojects"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "ANN", "TID"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW2901",
    "SIM108", "SIM105", "SIM113", "RUF001", "RUF002", "RUF003",
    "UP031",    # %-formatting is used on purpose where it reproduces C printf output
    "PLC0415",  # PyAV is imported lazily: it is only needed when a real video is probed
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Banned: this project relies on Python 3.14 deferred annotations (PEP 649/749)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "PT018", "E501"]
"scripts/gen_cases.py" = ["E501"]  # template lines are data

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts", "config.py", "native/build.py"]
exclude = ["reference", "native/subprojects", "**/__pycache__"]
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# LuaJIT raises every Lua error (even ones caught by pcall) as a Windows SEH exception with code
# 0xE24C4A0x; pytest's faulthandler plugin would print a "fatal exception" report for each one.
addopts = "-ra -p no:faulthandler"
